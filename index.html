<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate your experience</title>
<style>
  :root {
    --accent: #f5b301;
    --accent-dark: #d99a00;
  }
  * {
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #fff9ec 0%, #fef3e0 50%, #fdeee0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: white;
    border-radius: 20px;
    padding: 44px 32px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.10);
    animation: fadeIn 0.4s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .icon-badge {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    font-size: 28px;
    overflow: hidden;
  }
  .icon-badge img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 8px;
    color: #1a1a1a;
    line-height: 1.3;
  }
  p.subtitle {
    color: #888;
    margin-bottom: 32px;
    font-size: 15px;
  }
  .stars {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  .star {
    font-size: 44px;
    cursor: pointer;
    color: #e8e5e0;
    transition: color 0.15s ease, transform 0.15s ease;
    user-select: none;
    line-height: 1;
  }
  .star:hover, .star.hovered {
    color: var(--accent);
    transform: scale(1.15);
  }
  .feedback-box {
    display: none;
    margin-top: 24px;
    text-align: left;
    animation: fadeIn 0.3s ease-out;
  }
  .feedback-box.visible {
    display: block;
  }
